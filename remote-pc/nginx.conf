map $http_upgrade $connection_upgrade {
 default upgrade;
 '' close;
}
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
server {
 listen 10000 default_server;
 server_name _;
 root /usr/share/novnc;
 index vnc.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control "no-store" always;

 auth_basic "NEXUS Remote PC - Private";
 auth_basic_user_file /etc/nginx/.nexuspasswd;

 location = /health {
  auth_basic off;
  default_type text/plain;
  return 200 "nexus-remote-pc-ready\n";
 }
 location = / {
  return 302 /vnc.html?autoconnect=true&resize=scale&path=websockify;
 }
 location /websockify {
  limit_req zone=login burst=30 nodelay;
  proxy_pass http://127.0.0.1:6080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
 }
 location / {
  limit_req zone=login burst=30 nodelay;
  try_files $uri $uri/ =404;
 }
}
