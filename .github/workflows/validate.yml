name: Validate application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript
        run: node --check server.js
      - name: Check embedded browser JavaScript
        run: |
          node -e "const fs=require('fs');const vm=require('vm');const html=fs.readFileSync('index.html','utf8');const js=[...html.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]);if(!js.length)throw Error('Script missing');js.forEach(x=>new vm.Script(x));"
