name: Validate application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript
        run: node --check server.js
      - name: Check embedded browser JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script[^>]*>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Browser script missing');
          new vm.Script(match[1]);
          NODE
      - name: Test API routes and authentication
        run: node --test test/server.test.cjs
      - name: Check Runpod worker source
        run: python3 -m py_compile runpod/handler.py
      - name: Check startup script
        run: sh -n runpod/start.sh
