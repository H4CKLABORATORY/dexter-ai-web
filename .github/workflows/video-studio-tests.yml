name: Video Studio unit tests
on:
  pull_request:
    paths:
      - 'video-studio/**'
      - '.github/workflows/video-studio-tests.yml'
  push:
    paths:
      - 'video-studio/**'
      - '.github/workflows/video-studio-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no paid providers)
        run: python -m unittest discover -s video-studio/tests -v
      - name: Verify Python syntax
        run: python -m py_compile video-studio/studio.py video-studio/gui.py video-studio/reference_lab.py video-studio/editor.py
      - name: Check runner FFmpeg
        run: |
          command -v ffmpeg
          ffmpeg -version
      - name: Smoke fixture
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=320x180:r=15 -t 2 -c:v mpeg4 -q:v 5 -y /tmp/ffsample.mp4
      - name: Smoke import
        run: |
          python video-studio/studio.py prepare --name "Free Fire Demo" --source /tmp/ffsample.mp4
          python video-studio/reference_lab.py init
      - name: Smoke analyze
        run: python video-studio/reference_lab.py analyze --file /tmp/ffsample.mp4
      - name: Smoke edit plan
        run: python video-studio/editor.py plan --job free-fire-demo --platform tiktok --target 1.5
      - name: Smoke FFmpeg export
        run: |
          python video-studio/editor.py render --job free-fire-demo
          test -s video-studio/jobs/free-fire-demo/exports/edit-tiktok.mp4
