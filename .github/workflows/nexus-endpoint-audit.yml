name: NEXUS endpoint audit
on:
  pull_request:
    paths:
      - 'nexus-os/ai-apis/**'
      - '.github/workflows/nexus-endpoint-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node nexus-os/ai-apis/endpoint-audit.cjs
