map $http_upgrade $nexus_connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 10000 default_server;
  server_name _;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "no-store" always;
  auth_basic "DEXTER NEXUS private workstation";
  auth_basic_user_file /etc/nginx/.nexuspasswd;
  location = /health {
    auth_basic off;
    default_type text/plain;
    return 200 "nexus-workstation-gateway-ready\n";
  }
  location = / {
    return 302 /portal/;
  }
  location /portal/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
  }
  location = /shell { return 302 /shell/; }
  location /shell/ {
    proxy_pass http://127.0.0.1:7681;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nexus_connection_upgrade;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
  # OpenCode Web uses root-absolute paths. Serve it at /code/ through a
  # dedicated proxy path only after verifying app subpath compatibility.
  # Instead, use /app as the entry point and route remaining asset paths
  # to the same protected upstream.
  location = /app { return 302 /app/; }
  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nexus_connection_upgrade;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
  # Any root absolute URLs/clients from OpenCode also reach its upstream.
  location / {
    proxy_pass http://127.0.0.1:4096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nexus_connection_upgrade;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
}
