services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_CONTEXT_LENGTH: "2048"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-cpu:/root/.ollama
    mem_limit: 8g
volumes:
  ollama-cpu:
